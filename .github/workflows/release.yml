name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish the Windows archive
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The About page and the file properties show the crate version, so a
      # tag that disagrees with Cargo.toml would ship a mislabeled build.
      - name: Check the tag against the crate version
        shell: bash
        run: |
          version=$(cargo pkgid --package typomend | sed 's/.*[#@]//')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The release notes are this version's section of CHANGELOG.md, without
      # the link definitions at the end of the file.
      - name: Extract the release notes
        shell: bash
        run: |
          awk -v heading="## [$VERSION]" '
            /^## \[/ { if (found) exit; found = index($0, heading) == 1; next }
            /^\[[^]]*\]: / { next }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - run: cargo build --release --locked --package typomend

      # The MIT, Apache-2.0 and Unicode licenses of the crates and data built
      # into typomend.exe ask for their notices to ship with it.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-about@0.9.2
      - run: cargo xtask notices

      # The archive name ends in the target triple of the build, as ripgrep,
      # bat and nushell name theirs, so the download says which system and
      # processor it runs on. The build has no --target, so that is the host.
      - name: Name the archive
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          echo "ARCHIVE=typomend-$VERSION-$target.zip" >> "$GITHUB_ENV"

      # The files sit at the root of the archive, without a folder of their
      # own, because Extract All in File Explorer already extracts into a
      # folder named after the archive.
      - name: Package the release
        shell: pwsh
        run: |
          Compress-Archive -DestinationPath $env:ARCHIVE -Path `
            target/release/typomend.exe, LICENSE, NOTICE.md, TRADEMARKS.md, `
            target/THIRD-PARTY-NOTICES.txt, README.md, README.zh-TW.md

      - name: Write the checksum
        shell: bash
        run: sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
